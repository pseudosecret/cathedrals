version: 0.1

surface_container:
  fixed_value: null
  generated_from: generation_brief.genre_flavor
  frozen_at: genesis
dominant_regime_id: neutral

accused_claimant_id: null

indecision_count: 0
retraction_count: 0
contamination: 0

claimants_seen: []
artifacts_seen: []

world_scars: []
hidden_route_unlocked: false

rules:
  accusation:
    effects:
      - set_dominant_regime_id_to_accused_claimant_id
      - increase_world_scar
  retraction:
    effects:
      - clear_accused_claimant_id
      - increase_retraction_count
      - increase_contamination
      - add_world_scar
  indecision:
    effects:
      - increase_indecision_count
      - if_indecision_count_gte_3_then_increase_contamination
  hidden_route:
    trigger:
      all_of:
        - seen_all_claimants
        - no_stable_commitment
        - contamination_gte: 3
