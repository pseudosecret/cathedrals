version: 0.1

work:
  id: hospice-annex-v01
  title_working: "The Annex"
  format: literary_escape_room
  status: engine_revision
  description: >
    A static, build-time-generated literary mystery set in a snowbound hospice annex
    where accusation selects reality, indecision accumulates contamination, and the
    reader gradually realizes they are judging rather than merely investigating. The
    story's arcs should be exciting, gripping, and thrilling, regardless of any
    narrative/stylistic contamination present.

execution_phase:
  current_phase: graph_or_build 
  allowed_engine_roots:
    - engine/docs
    - engine/canon
    - engine/data
    - engine/prompts
    - engine/planning
    - engine/llm-instructions.md
  phase_write_policy:
    engine_revision:
      engine_writes_allowed: true
      schema_generation_writes_allowed: false
      prose_writes_allowed: false
      graph_compilation_allowed: false
      planning_compilation_allowed: false
      prose_generation_allowed: false
      build_mutation_allowed: false
      change_phase_allowed: false
      notes:
        - "Use engine-revision passes to change canon, data, prompts, docs, and templates only."
        - "Do not create, update, or regenerate files under schema-generation/ during this phase."
        - "Do not create, update, or regenerate files under prose/ during this phase."
        - "If compiled outputs need to change, switch phases explicitly before doing that work."
    planning_compilation:
      engine_writes_allowed: true
      schema_generation_writes_allowed: true
      prose_writes_allowed: false
      graph_compilation_allowed: false
      planning_compilation_allowed: true
      prose_generation_allowed: false
      build_mutation_allowed: false
      change_phase_allowed: true
    prose_generation:
      engine_writes_allowed: true
      schema_generation_writes_allowed: true
      prose_writes_allowed: true
      graph_compilation_allowed: false
      planning_compilation_allowed: true
      prose_generation_allowed: true
      build_mutation_allowed: false
      change_phase_allowed: true
    graph_or_build:
      engine_writes_allowed: true
      schema_generation_writes_allowed: true
      prose_writes_allowed: true
      graph_compilation_allowed: true
      planning_compilation_allowed: true
      prose_generation_allowed: true
      build_mutation_allowed: true
      change_phase_allowed: true
  global_rules:
    - "Current phase gates what directories may be mutated."
    - "Phase changes must happen in repo truth before downstream compilation begins."
    - "Engine revision is the default when revising the engine itself."

scope:
  target_form: short_playable_work
  target_total_arcs: 7
  target_total_scenes_min: 23
  target_total_scenes_soft_max: 43
  target_total_scenes_hard_max: 65
  target_total_artifacts_min: 5
  target_total_artifacts_soft_max: 12
  target_total_endings: 18
  notes:
    - "This is the first instantiation of the engine, not the final large-scale work."
    - "Favor legitimate branching depth over fake breadth or claimant-spine symmetry."
    - "Five claimants are canonical for hospice-annex-v01."

surface_container:
  id: snowbound_hospice_annex
  label: Snowbound Hospice Annex
  description: >
    A sealed, materially concrete annex attached to or adjacent to a hospice-like
    facility in winter isolation. It contains rooms, intake records, maintenance
    traces, medication and treatment documentation, personal effects, and signs of
    ongoing institutional use. It should feel real enough to anchor the reader before
    ontological drift becomes obvious.
  properties:
    isolated: true
    mutable: true
    institution_like: true
    domestic_traces_present: true
    weather_pressure: snowbound
    traversal_style: room_document_interview
  mutation_law_summary: >
    The annex mutates in response to judgment pressure. As one claimant’s regime
    becomes dominant, room function, document tone, naming conventions, and sensory
    atmosphere drift toward that claimant’s ontology.

central_transgression:
  id: impossible_release
  summary: >
    A patient or resident was moved, released, transferred, or signed out under
    contradictory and possibly impossible circumstances.
  surface_question: "Who is responsible for the impossible release?"
  underlying_pressure: >
    The apparent question of institutional responsibility conceals a deeper struggle
    over what kind of reality is being selected through judgment.
  constraints:
    - "The transgression must remain concrete on the surface."
    - "Do not resolve the deeper metaphysical layer too early."
    - "Different claimants must frame the same event differently."
    - "Evidence must be interpretable under multiple regimes."

reader_role:
  apparent_role: investigator
  actual_role: judge
  hidden_implication: >
    By interpreting evidence and accusing a claimant, the reader collapses the annex
    toward one world-logic and starves alternative realities.
  behavioral_risks:
    - premature certainty
    - false neutrality
    - extractive completionism
    - prolonged refusal to commit

claimants:
  roster_source_path: engine/data/claimant-rosters/hospice-annex-v01.yaml
  source_priority:
    - work_specific_roster
    - global_claimant_library
  active:
    - operative
    - haunter
    - curator
    - witness
    - contrast_slot
  inactive: []
  route_ids:
    operative: operative_route
    haunter: haunter_route
    curator: curator_route
    witness: witness_route
    contrast_slot: contrast_route
  notes:
    - "Use the work-specific roster before the global claimant library for hospice-annex-v01."
    - "Five claimants are active for this work instance."
    - "The opening hub remains a three-option decision rather than a five-claimant picker."

claimant_generation:
  mode: mixed_authoring
  semantic_drift: mode_governed
  balancing_mode: hybrid
  variation_level: high
  seed: hospice-annex-v01-claimants-v2
  output_profile_path: schema-generation/claimant-profiles/hospice-annex-v01-claimant-profiles.yaml
  compile_stage: before_arc_briefs
  definition_mode_rules:
    locked:
      selection_rule: exact_authored_reuse
      notes:
        - "Locked claimants reproduce their authored surface persona, claimant law, and expressive materials exactly."
    bounded_variation:
      selection_rule: select_within_authored_variation_policy
      notes:
        - "Bounded-variation claimants may drift only within the fields named by their variation_policy."
        - "Claimant law, route identity, and forbidden traits remain fixed."
    slot_generated:
      selection_rule: derive_from_slot_spec_via_seeded_contrast_scoring
      notes:
        - "Slot-generated claimants are derived from their slot_spec plus seed and the other active claimants."
        - "Generated outputs must maximize contrast while remaining grounded in annex ontology."
  hard_separation_requirements:
    - "Each active claimant must preserve its mode-governed identity integrity."
    - "Each active claimant must preserve its role pressure and route identity."
    - "No active claimant pair may share the same primary truth style family."
    - "No active claimant pair may share the same primary evidence family."
    - "No active claimant pair may share the same voice family."
    - "Forbidden traits remain fixed and non-negotiable."
  scoring_axes:
    - literary_genre_distance
    - secondary_evidence_affinities
    - speech_texture_variants
    - contradiction_motifs
    - environmental_drift_variants
    - local_framing_tendencies
    - artifact_pressure_profile
    - scene_surface_mutation_details
  anti_slop_guardrails:
    - "Reject claimant sets that are numerically distinct but still read as voice-blurred."
    - "Reject drift that weakens route differentiation instead of sharpening it."
    - "Reject novelty that changes ontology, role pressure, or forbidden traits unlawfully."
    - "Reject generated contrast slots that overlap the authored four in genre feel, evidence logic, or cadence."
  notes:
    - "Locked claimants must reproduce authored source exactly."
    - "Bounded-variation claimants may drift only within authored variation_policy."
    - "Slot-generated claimants must be derived deterministically from slot_spec plus seed."
    - "Claimant profiles are compiled structural artifacts, not new canon."
    - "Determinism matters: the same seed and source data should reproduce the same claimant profiles."

route_model:
  entry_route: introduction_route
  primary_routes:
    - introduction_route
    - operative_route
    - haunter_route
    - curator_route
    - witness_route
    - contrast_route
  special_routes:
    - contamination_route
  route_constraints:
    - "The work must begin with a reader-perspective introduction before claimant-bound branch emphasis."
    - "The opening introduction does not need to introduce every claimant explicitly."
    - "The first live choice hub must branch into exactly three distinct onward scene directions."
    - "Post-hub structure must splinter beyond claimant-spine linearity."
    - "Reconvergence is allowed only when prior branch state still matters."
    - "Each claimant route must feel ontologically distinct even when the surface genres are radically different."
    - "Route differences must not be merely cosmetic."
    - "At least one artifact should pressure each claimant route differently."
    - "Accusation endings must visibly alter reality."
    - "Retraction may exist, but should not dominate v0.1 scope."

branching_experience_model:
  introduction_sequence:
    required: true
    reader_perspective_required: true
    introduction_scene_count_min: 3
    introduction_scene_count_soft_max: 5
    reflection_interstitial_budget_pages_max: 1.5
    claimant_full_roster_reveal_required: false
    must_end_in_opening_choice_hub: true
    rules:
      - "The introduction should be eventful, interesting, and concretely situate the reader inside the annex."
      - "Reflection is allowed only as pressure-bearing interiority, not inert padding."
      - "The introduction should orient the reader toward a decision without flattening the mystery into exposition."
  opening_choice_hub:
    required: true
    option_count_exact: 3
    option_label_rule: summary_of_scene_level_decision
    rules:
      - "Each opening option must summarize the scene-level decision the reader is making."
      - "The three opening options must branch into materially different next scenes."
      - "The opening choice must not be a disguised claimant list with no situational pressure."
  decision_option_policy:
    live_option_min: 2
    live_option_soft_max: 4
    live_option_hard_max: 5
    single_live_choice_disallowed: true
    click_without_alternative_disallowed: true
    rules:
      - "A clickable surface is not a meaningful decision unless at least two live options are present."
      - "Choice sets may exceed four only when structural pressure clearly justifies it, and never above five."
      - "Reserved or closed siblings do not count toward the live-option minimum."
  branch_topology:
    model: splinter_and_rejoin_tree
    secondary_splits_required: true
    reconvergence_allowed: true
    literal_shared_scene_reuse_allowed: true
    variable_terminal_depth_required: true
    redirective_endings_allowed: true
    rules:
      - "Opening branches must splinter into further decisions rather than collapsing into one shallow route spine."
      - "Some branches may reconverge into similar or identical scenes, but inbound state must remain legible."
      - "Different branches may terminate at different depths."
      - "At least one lawful ending family may redirect into a new beginning on a different branch."
  major_decision_hesitation:
    required_for_major_decisions: true
    major_decision_definition:
      - accusation_commitment
      - branch_lock
      - irreversible_threshold_crossing
    required_reflection_mode: anxious_counterfactual_pressure
    required_option_labels:
      - commit_and_do_the_thing
      - hesitate_and_reconsider
    hesitation_can_mutate_prior_context: true
    hesitation_can_open_new_path: true
    rules:
      - "Before major commitment, the reader should feel the character thinking through dread, anxiety, and projected outcomes."
      - "Hesitation is not a null action; it must leave residue, mutate pressure, or create a different onward path."
  navigation_surface:
    top_reset_label: start_over
    fake_back_disallowed: true
    rules:
      - "If the top control resets progress to the beginning, label it start_over."
      - "Do not present a prior-page promise when no true back-navigation state exists."
      - "Reset behavior must be semantically distinct from hesitation or reconsideration inside the story."

state_logic_profile:
  accusation_enabled: true
  retraction_enabled: true
  indecision_enabled: true
  contamination_enabled: true
  hidden_route_enabled: true
  state_priorities:
    - accusation
    - dominant_regime
    - contamination
    - indecision_count
    - retraction_count
    - world_scars
  notes:
    - "Indecision preserves plurality temporarily but becomes costly when prolonged."
    - "Retraction should reopen ambiguity but leave residue."
    - "Contamination should emerge from noncommittal, extractive traversal."

hidden_route:
  id: contamination_route
  enabled: true
  premise: >
    A reader who tries to consume all possible interpretations without accepting the
    cost of judgment begins to resemble the very noncommittal, parasitic intelligence
    the system fears or is attempting to detect.
  trigger_logic:
    all_of:
      - seen_all_active_claimants
      - no_stable_commitment
      - contamination_gte_3
  route_effects:
    - "The reader is reframed as object of judgment."
    - "Neutrality becomes suspect."
    - "The system recognizes behavior rather than belief."
  constraints:
    - "Do not make this route feel like a completionist prize."
    - "It must emerge from thematically legible behavior."
    - "It should reframe the reader rather than merely reward exploration."

artifacts:
  families:
    - intake_document
    - maintenance_log
    - treatment_chart
    - personal_letter
    - release_form
    - room_assignment_record
  artifact_rules:
    - "Artifacts are evidence, not decoration."
    - "Each artifact must support, complicate, or bias interpretation."
    - "At least one artifact must plausibly support multiple claimants."
    - "Artifacts must remain readable on mobile."
  v0_1_minimum:
    required_count: 3
    current_milestone_count: 3

ending_model:
  allowed_endings:
    - accusation_operative
    - accusation_haunter
    - accusation_curator
    - accusation_witness
    - accusation_contrast
    - contamination_ending
    - redirect_beginning
  ending_families:
    - accusation_collapse
    - contamination_implication
    - redirective_new_beginning
  ending_rules:
    - "Each accusation ending must visibly collapse the annex into that claimant’s regime."
    - "The contamination ending must implicate the reader."
    - "Some endings may function as new beginnings that redirect the reader onto another branch."
    - "Endings do not all need to terminate at the same structural depth."
    - "Do not over-explain the hidden cosmology in endings."
    - "Endings should feel like selection and foreclosure, not just conclusion."
  decision_scar_view:
    enabled: true
    default_mode: normal
    debug_mode_available: true
    render_rules:
      - "Render the taken path as the primary spine."
      - "Render closed sibling options at each decision point."
      - "In normal mode, show rejected option labels only."
      - "In debug mode, show rejected option labels plus destination scene titles."
      - "Do not render the full decision tree by default."

threshold_geomancy:
  enabled: true
  role: compositional_engine
  purpose:
    - scene_flow
    - transition_logic
    - arc_pressure
    - premature_termination_bias
  constraints:
    - "Use threshold geomancy as hidden generation grammar first, not explicit lore."
    - "Do not invent resultant math."
    - "Use only explicitly defined figure meanings and resultant rules."
    - "If a rule is missing, flag it rather than guessing."
  operational_model:
    - "Assign a threshold figure to each scene."
    - "Assign a next-figure when a subsequent scene exists."
    - "Use the current figure to shape the scene’s motion."
    - "Use the resultant of current and next to shape the transition."
    - "Allow arc termination before a next scene if termination conditions are met."

arc_rules:
  default_min_scenes_per_arc: 4
  default_soft_max_scenes_per_arc: 8
  default_hard_max_scenes_per_arc: 12
  early_termination_enabled: true
  allowed_premature_endings:
    - death
    - disappearance
    - unresolved_exit
    - collapse
    - adjudicated_lock
  constraints:
    - "Arcs are finite."
    - "Not every arc must reach full realization."
    - "Premature endings must feel like consequences, not missing content."
    - "Arc structure must permit splintering, reconvergence, and unequal terminal depth."

style_profile:
  tone: controlled_weirdness
  density: literary_but_legible
  emphasis:
    - concrete_detail_before_abstraction
    - pressure_before_explanation
    - claimant_specific_register
    - artifacts_as_real_objects
  prohibitions:
    - lore_dumping
    - generic_ominous_atmosphere
    - faux_profundity
    - claimant_voice_blurring
    - decorative_artifacts
    - AI_stock_phrases
  notes:
    - "This work should feel architecturally dense rather than branchy."
    - "Weirdness must be patterned and legible, not random."

prose_contamination:
  enabled: true
  primary_driver: claimant_focus
  required_surfaces:
    - scenes
    - artifacts
  deferred_surfaces:
    - endings
  focus_ladder:
    ambient: mostly_neutral
    passing_focus: very_light_to_light
    primary_focus: moderate
    dominant_focus: moderate_to_heavy
  operational_rules:
    - "Focus, not accusation alone, determines contamination intensity."
    - "Scene prose must show contamination through diction, cadence, and structure when focus is primary or dominant."
    - "Artifact framing may drift more than the core document body."
    - "Document bodies must remain plausible and readable objects."
    - "Heavy contamination must remain materially grounded and parseable."

generation_resolution_policy:
  deterministic_resolution:
    seed_namespace: hospice-annex-v01
    reproducibility_required: true
    selection_rule: seeded_bounded_choice
    notes:
      - "All machine-resolved selections must be derivable from repo truth plus seed."
      - "Selections may vary across works, but not across repeated runs of the same work and seed."
  patient_identity_policy:
    internal_subject_id: released_resident_01
    external_identity_mode: role_defined_optional_name
    naming_strategy:
      allowed:
        - unnamed
        - first_name_only
        - surname_only
        - role_reference_only
      disallowed:
        - full_biographical_dossier
        - melodramatic_symbolic_naming
        - route_specific_identity_replacement
    default_selection:
      primary_mode: role_reference_only
      reveal_thresholds:
        planning: unnamed
        prose_generation: unnamed_or_partial
        endings: partial_allowed
    invariants:
      - "The same underlying resident must be referenced across all routes."
      - "Contradictions may affect framing, chart position, room relation, or naming form, but not replace the underlying subject."
      - "Identity must remain concrete enough to anchor the impossible release."
    validation:
      must:
        - preserve_single_subject_continuity
        - avoid_backstory_bloat
      fail_if:
        - route_specific_subject_substitution
        - proper_name_forced_without_structural_need
  metaphysical_visibility_policy:
    current_band: residue_forward
    allowed_bands:
      - surface_only
      - residue_forward
      - drift_explicit
      - overt_metaphysical
    band_rules:
      planning:
        max_allowed: residue_forward
      prose_generation_v0_1:
        max_allowed: residue_forward
      endings_v0_1:
        max_allowed: drift_explicit
    permitted_manifestations:
      - regime_drift
      - environmental_contradiction
      - ontological_residue
      - judgment_pressure
      - impossible_administrative_coherence
    forbidden_manifestations_before_late_scope:
      - direct_cosmology_exposition
      - named_metaphysical_systems
      - explicit_explanation_of_adjudication_mechanics
    validation:
      must:
        - keep_surface_transgression_concrete
      fail_if:
        - hidden_layer_explains_itself
        - metaphysical_content_displaces_dramatic_function
  contamination_policy:
    primary_driver: claimant_focus
    focus_bands:
      ambient: mostly_neutral
      passing_focus: very_light_to_light
      primary_focus: moderate
      dominant_focus: moderate_to_heavy
    spotlight_rules:
      scenes: focus_scaled
      artifacts:
        framing: focus_scaled
        document_body: constrained_focus_scaled
      endings: deferred_until_explicit_scope
    trigger_rules:
      accusation_alone_is_insufficient: true
      indecision_can_accumulate_contamination: true
      prolonged_noncommitment_can_unlock_hidden_route: true
    invariants:
      - "Contamination intensity is determined by spotlight pressure, not by route label alone."
      - "Claimant-specific contamination must appear in diction, cadence, and structure."
      - "Heavy contamination must remain readable and concretely grounded."
    validation:
      must:
        - claimant_specific_surface_behavior
        - framing_body_separation_for_artifacts_when_needed
      fail_if:
        - adjective_swap_only
        - generic_uncanniness
        - unreadable_document_body
  route_architecture_policy:
    architecture_model: introduction_hub_branch_tree_with_reconvergence
    work_level_requirements:
      introduction_sequence_required: true
      introduction_scene_count_min: 3
      introduction_scene_count_soft_max: 5
      opening_choice_hub_required: true
      opening_choice_option_count: 3
      reader_perspective_introduction_required: true
      reflection_interstitial_budget_pages_max: 1.5
    route_level_requirements:
      required_beat_families:
        - introduction_or_orientation
        - invitation_or_plausibility
        - contradiction_or_artifact_pressure
        - threshold
      optional_beat_families:
        - hesitation
        - aftershock
        - residue
        - premature_lock
      minimum_scene_jobs_per_scene: 2
    decision_cardinality_policy:
      live_option_min: 2
      live_option_soft_max: 4
      live_option_hard_max: 5
      single_live_choice_disallowed: true
      major_decision_requires_hesitation_surface: true
    per_route_scene_budget_policy:
      default_min: 4
      default_soft_max: 8
      default_hard_max: 12
      claimant_variation_allowed: true
      variation_rule:
        - "Shorter routes are lawful if dramatic pressure escalates cleanly and threshold consequence lands."
        - "Longer routes are lawful if each additional scene performs distinct structural work."
    branch_topology_policy:
      opening_hub_exact_option_count: 3
      secondary_splits_required: true
      reconvergence_allowed: true
      identical_shared_scene_reuse_allowed: true
      variable_terminal_depth_required: true
      redirective_endings_allowed: true
    route_shape_constraints:
      - "The work must begin with an eventful introduction before the first choice hub."
      - "All claimant routes must satisfy the authored architecture, not just mood progression."
      - "Variation may alter pacing, amplitude, and scene count, but not remove threshold consequence."
      - "Post-hub branches must continue to split or reconverge meaningfully rather than march as parallel three-scene spines."
      - "No route may become structurally inert, baggy, or single-choice linear."
    validation:
      must:
        - preserve_reader_perspective_introduction
        - preserve_opening_choice_hub
        - preserve_decision_cardinality_bounds
        - preserve_hesitation_surfaces_for_major_decisions
        - preserve_meaningful_reconvergence
        - preserve_authored_architecture
        - justify_scene_count_variation
      fail_if:
        - opening_sequence_is_claimant_menu_disguised_as_drama
        - any_decision_has_fewer_than_two_live_options
        - every_branch_terminates_at_the_same_shallow_depth
        - hesitation_surface_is_missing_for_irreversible_choice
        - claimant_route_is_only_cosmetically_distinct
        - additional_scenes_do_not_add_new_structural_work
  retraction_policy:
    v0_1_mode: stateful_non_route_action
    current_playability:
      planning: yes_as_state_logic
      prose_generation_v0_1: optional_local_choice_only
      route_family: false
      ending_family: false
    state_effects:
      - clear_accused_claimant
      - increase_retraction_count
      - increase_contamination
      - add_world_scar
    dramatic_requirements:
      - "Retraction must reopen ambiguity."
      - "Retraction must leave damage."
      - "Retraction must reduce trust in neutrality."
    usage_constraints:
      - "Retraction may appear as a local decision or aftermath behavior."
      - "Retraction must not dominate v0.1 route identity."
      - "Retraction must not become a separate claimant alternative in parity planning."
    validation:
      must:
        - leave_residue
      fail_if:
        - acts_as_cost_free_reset
        - becomes_primary_route_content_without_scope_change

build_target:
  framework: astro
  content_format: mdx
  static_only: true
  no_live_api_calls: true
  no_server_side_processing: true
  output_goal: >
    Prose and artifact files should remain directly readable and editable as MDX
    during development, without requiring full site compilation for every revision.

repo_layout:
  engine_root: engine
  planning_dir: engine/planning
  schema_generation_dir: schema-generation
  prose_dir: prose
  expectations:
    - "Canon, operator docs, prompts, and planning templates live under engine/."
    - "Compiled structural artifacts live under schema-generation/."
    - "Generated prose and artifacts live under prose/."
    - "The repo is the source of truth."
    - "Linear tracks execution, not canon."

linear_workflow:
  enabled: true
  role: execution_tracker
  rules:
    - "Arc briefs and scene specs should be stored in repo first, then mirrored into Linear."
    - "Linear must not be the only location for lore or route truth."
    - "No scene should be generated without a scene spec."
    - "No task should be marked complete without validation."
    - "If repo and Linear disagree, repo wins."

validation_profile:
  required_checks:
    - introduction_sequence_integrity
    - opening_choice_hub_integrity
    - decision_cardinality
    - hesitation_surface_integrity
    - reconvergence_integrity
    - claimant_profile_balance
    - planning_parity_completeness
    - focus_scaled_contamination
    - ontology_consistency
    - claimant_consistency
    - scene_function
    - route_differentiation
    - cross_route_artifact_differentiation
    - style_compliance
    - artifact_relevance
    - mobile_readability
  rejection_conditions:
    - "Introduction pages that feel inert, purely reflective, or like setup notes instead of dramatic entry."
    - "Decision points with only one live option."
    - "Opening branches that never splinter again."
    - "Reconvergence that erases all consequence of prior choices."
    - "Claimant profiles that are interchangeable despite different scores"
    - "Atmospheric but inert prose"
    - "Claimant routes that feel cosmetically different but structurally the same"
    - "Artifacts that do not change interpretation"
    - "Scenes that do not perform a beat function"
    - "Lore explanation replacing dramatic consequence"

planning_expectations:
  required_generated_artifacts:
    - schema-generation/work-briefs/*.md
    - schema-generation/claimant-profiles/*.yaml
    - schema-generation/arc-briefs/*.md
    - schema-generation/scene-specs/*.md
    - schema-generation/artifact-specs/*.md
  generation_order:
    - "Read canon and data files."
    - "Compile work brief."
