  manual_phase_edit_required_to_leave_engine_revision: true
  manual_phase_edit_required_for_downstream_activation: false
  autonomous_progression:
    enabled: true
    engine_revision_exit_requires_human_edit: true
    downstream_phase_updates_agent_authorized: true
    advance_immediately_after_validation_pass: true
    advance_requires_validation_report_pass: true
    advance_requires_all_deliverables_present: true
    advance_requires_no_stop_conditions: true
    record_transition_in_repo_truth: true
