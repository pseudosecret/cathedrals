version: 2.0

work:
  id: hospice-annex-v01
  title_working: "The Annex"
  format: literary_escape_room
  status: engine_revision
  generated_work_present: false
  description: >
    A static nonlinear literary work to be generated in one autonomous, uninterrupted,
    append-only run inside a snowbound hospice-annex frame. Interpretation,
    commitment, hesitation, and foreclosure alter what the annex can sustain.

execution_phase:
  current_phase: engine_revision
  current_operation: executable_generator_refactor
  downstream_outputs_authoritative: false
  allowed_write_roots:
    - engine
  forbidden_write_roots:
    - schema-generation
    - prose
    - src
  rules:
    - "Engine revision changes the machine only."
    - "Leaving engine_revision requires a new explicit human generation instruction."
    - "A milestone is complete only when every declared output exists."
    - "Historical claims never establish current executable truth."

milestone_control:
  active_milestone_id: executable_generator_refactor_05
  active_milestone:
    id: executable_generator_refactor_05
    phase: engine_revision
    status: completed
    purpose: >
      Add the repository-local Cathedrals executable that directly drives LM Studio,
      immutable commits, deterministic resume, validation, and the static web build.
    completed_outputs:
      - engine/data/work-instance.yaml
      - engine/data/claimants.yaml
      - engine/data/generation-protocol.schema.json
      - engine/docs/generation-workflow-contract.md
      - engine/docs/content-schema-contract.md
      - engine/prompts/generation-genesis.md
      - engine/prompts/generation-architecture.md
      - engine/prompts/generation-packet.md
      - engine/prompts/generation-ending-packet.md
      - engine/prompts/generation-index.md
      - engine/tests/validate-generation-protocol.py
      - engine/formats/web.md
      - engine/formats/visualnovel.md
      - cathedrals
      - .gitignore
      - engine/tests/test_cathedrals.py
    downstream_outputs_created: false
  next_milestone:
    id: first_interactive_autonomous_generation_test_06
    status: inactive
    activation_requires_explicit_human_instruction: true
    requested_scene_scope_required: true
    single_initial_generation_request_required: true
  historical_record: engine/docs/first-spike-freeze.md
  historical_record_is_executable: false

integrity_repairs:
  cleanup_completed_before_engine_revision_reset: true
  removed_noncanonical_outputs:
    - schema-generation/decision-graph.json
  removed_filesystem_metadata_count: 11
  ignored_filesystem_metadata_pattern: "*:Zone.Identifier"
  notes:
    - "The deleted decision graph described a historical claimant-specific slice and referenced absent sources."
    - "No generated prose or complete Astro story pages existed in this repository."

authorship_boundary:
  engine_canon:
    authority: human_authored
    may_define:
      - artistic_doctrine
      - thematic_gravity
      - setting_envelope
      - ontology_as_world_law
      - fractal_grammar
      - branching_and_state_mechanics
      - threshold_geomancy
      - scope_and_output_budgets
      - validation_and_build_law
  generated_work_canon:
    authority: one_autonomous_append_only_generation_run
    absent_before_generation: true
    must_define:
      - claimant_identities_and_relationships
      - all_character_names_roles_and_personalities
      - exact_central_incident_and_chronology
      - exact_evidence_clues_and_contradictions
      - arc_and_scene_purposes
      - scene_events_and_reader_facing_choices
      - artifacts_and_their_contents
      - generated_motifs_and_environmental_mutations
      - endings_poetry_and_all_reader_facing_prose
    promotion_to_engine_canon_forbidden: true
  deterministic_tooling:
    may_derive:
      - seeded_abstract_branch_topology
      - scene_slot_counts_and_decision_cardinalities
      - state_transition_envelope
      - threshold_figure_assignments_and_resultants
      - output_budget
      - prompt_context_and_hashes
      - parsed_files_frontmatter_checksums_and_manifest
    may_not_decide:
      - fictional_identity
      - plot_or_scene_events
      - exact_artifacts_or_clues
      - prose_or_poetry
      - endings

surface_container:
  id: snowbound_hospice_annex
  fixed_law:
    - "The work begins in an enclosed hospice annex under winter isolation."
    - "Care, administration, rooms, records, personal traces, and material wear remain legible."
    - "The reader initially investigates."
    - "Interpretation and commitment exert consequences on reality."
    - "Ambiguity cannot remain cost-free indefinitely."
  generated_particulars:
    - exact_layout_and_rooms
    - exact_people_and_relationships
    - exact_records_objects_and_traces
    - exact_history_of_the_annex

central_transgression:
  abstraction_level: event_class_only
  class: >
    A concrete threshold event involving admission, release, transfer, removal,
    exclusion, or custodial responsibility occurred under mutually incompatible
    circumstances.
  generated_particulars:
    - event_type
    - subject_or_subjects
    - chronology
    - causes_and_culpability
    - records_and_witness_relationships
    - clues_contradictions_and_competing_interpretations
    - consequences
  constraints:
    - "Keep the surface event materially concrete."
    - "Do not expose a complete metaphysical explanation early."
    - "The evidence must sustain incompatible readings until commitment has cost."

reader_role:
  apparent_role: investigator
  actual_role: judge
  action_law:
    - "Commitment selects and forecloses."
    - "Hesitation has consequences and is not undo."
    - "Retraction reopens ambiguity but leaves residue."
    - "Extractive completionism increases contamination."

claimants:
  count_exact: 5
  slot_ids:
    - claimant_slot_01
    - claimant_slot_02
    - claimant_slot_03
    - claimant_slot_04
    - claimant_slot_05
  authoring_mode: generated_together_in_genesis_creative_step
  locked_fictional_claimants_allowed: false
  preassigned_slot_semantics_allowed: false
  opening_hub_is_claimant_selector: false
  generated_fields:
    - stable_generated_id
    - name
    - exact_role_and_relationship_to_incident
    - occupation_if_any
    - personality_and_emotional_register
    - epistemic_regime
    - relationship_to_responsibility
    - evidence_logic_and_evidence_family
    - rhetoric_cadence_and_diction
    - contradiction_mode
    - artifact_affinity
    - environmental_pressure
    - literary_and_genre_effects
    - accusation_and_retraction_consequences
  set_constraints_source: engine/data/claimants.yaml

aesthetic_attractor:
  freedom_profile:
    artistic_identity: low
    fictional_instantiation: high
  pressures:
    - institutional_materiality
    - care_and_responsibility
    - isolation_and_winter
    - interior_enclosure
    - opening_closing_and_thresholds
    - admission_release_and_exclusion
    - memory_documentation_and_absence
    - judgment_contradiction_and_implication
    - commitment_and_foreclosure
    - the_cost_of_refusing_commitment
  central_theme: "Saying yes is the biggest no one can say to everything else."
  formal_poetry:
    required_integrated_compositions_min: 2
    exact_forms_and_placement_generated: true

branching_experience_model:
  introduction_sequence:
    reader_perspective_required: true
    scene_surfaces_before_first_live_hub_min: 3
    scene_surfaces_before_first_live_hub_max: 5
    eventful_and_pressure_bearing: true
  opening_choice_hub:
    live_option_count_exact: 3
    option_content_generated: true
    claimant_selector_forbidden: true
    requirements:
      - "Each option is a genuine situated action."
      - "Each option changes direction and interpretive pressure."
      - "Labels describe decisions rather than destinations."
  decisions:
    live_option_min: 2
    live_option_soft_max: 4
    live_option_hard_max: 5
    single_option_choice_forbidden: true
  topology:
    abstract_skeleton_prepared_deterministically: true
    opening_branches_split_again: true
    meaningful_reconvergence_allowed: true
    inbound_state_survives_reconvergence: true
    variable_branch_depth_required: true
    redirective_endings_allowed: true
  major_decisions:
    hesitation_surface_required: true
    hesitation_has_state_consequence: true
    hesitation_is_undo: false
  navigation:
    global_reset_label: start_over
    global_reset_is_reconsideration: false

fractal_grammar:
  sequence:
    - encounter
    - interpret
    - pressure
    - choose_or_defer
    - consequence
    - residue
  applies_at:
    - work
    - branch
    - sequence
    - scene
    - threshold
    - artifact_interaction

threshold_geomancy:
  enabled: true
  source: engine/data/threshold-geomancy.yaml
  phase: deterministic_preparation
  prepared_outputs:
    - figure_assignments
    - resultants
    - structural_pressures
    - transition_tendencies
    - rupture_and_termination_biases
  reinterpretation_after_generation_forbidden: true

state_logic_profile:
  variables:
    - accused_claimant_id
    - dominant_regime_id
    - contamination
    - indecision_count
    - retraction_count
    - claimants_seen
    - artifacts_seen
    - world_scars
    - hidden_route_unlocked
  hidden_route_law:
    premise: >
      A reader who consumes interpretations without accepting commitment becomes an
      object of judgment rather than a rewarded completionist.
    exact_manifestation_generated: true

scope:
  selection_law: >
    The frozen possible_scene_count supplied by the user is the primary run-level
    scale input. Profiles are nonbinding heuristics used only to derive budgets.
  profiles:
    pilot:
      scenes: { min: 14, target: 16, hard_max: 18 }
      artifacts: { min: 5, target: 6, hard_max: 7 }
      endings: { min: 5, target: 6, hard_max: 7 }
      formal_compositions: { min: 2, target: 2, hard_max: 3 }
      literary_words: { target: 12000, hard_max: 15000 }
      creative_steps: { target: 6, hard_max: 10 }
      run_input_tokens_hard_max: 600000
      run_output_tokens_hard_max: 110000
      memory_records_hard_max: 1200
    standard:
      scenes: { min: 30, target: 40, hard_max: 50 }
      artifacts: { min: 8, target: 11, hard_max: 14 }
      endings: { min: 7, target: 9, hard_max: 10 }
      formal_compositions: { min: 3, target: 4, hard_max: 5 }
      literary_words: { target: 27000, hard_max: 35000 }
      creative_steps: { target: 12, hard_max: 18 }
      run_input_tokens_hard_max: 1200000
      run_output_tokens_hard_max: 200000
      memory_records_hard_max: 3000
    large:
      scenes: { min: 60, target: 72, hard_max: 100 }
      artifacts: { min: 15, target: 20, hard_max: 25 }
      endings: { min: 10, target: 14, hard_max: 18 }
      formal_compositions: { min: 4, target: 6, hard_max: 8 }
      literary_words: { target: 42300, hard_max: 60000 }
      creative_steps: { target: 18, hard_max: 28 }
      run_input_tokens_hard_max: 2000000
      run_output_tokens_hard_max: 320000
      memory_records_hard_max: 6000
    cathedral:
      scenes: { min: 100, target: 130, hard_max: 180 }
      artifacts: { min: 25, target: 32, hard_max: 40 }
      endings: { min: 16, target: 22, hard_max: 28 }
      formal_compositions: { min: 6, target: 9, hard_max: 12 }
      literary_words: { target: 80000, hard_max: 110000 }
      creative_steps: { target: 32, hard_max: 52 }
      run_input_tokens_hard_max: 4000000
      run_output_tokens_hard_max: 600000
      memory_records_hard_max: 12000
  prose_word_limits:
    scene_target: 450
    scene_hard_max: 600
    artifact_target: 250
    artifact_hard_max: 350
    ending_target: 350
    ending_hard_max: 500
  packet_shape:
    literary_scenes_min: 3
    literary_scenes_max: 8
    endings_min: 2
    endings_max: 6
    associated_artifacts_max: 6
  notes:
    - "Unequal branch depth is required; counts do not imply claimant-route symmetry."
    - "Reused locations and stateful variants count only when the state difference matters."
    - "The large target is 42,300 literary words: 72x450 scene, 20x250 artifact, and 14x350 ending words."
    - "The executable must not clamp an explicit scene scope to a profile hard maximum."

format_selection:
  accepted_request_values:
    - web
    - visualnovel
    - visual_novel_aliases
  active_generation_format: web
  visualnovel_status: deferred
  visualnovel_alias_behavior: preserve_request_but_generate_web
  renpy_bootstrap_active: false

generation_budget:
  calculation_version: 3
  primary_scale_input: possible_scene_count
  words_per_token_assumption: 0.75
  max_prepared_context_tokens: 49152
  max_retrieved_source_tokens: 12288
  max_creative_packet_literary_words: 4800
  creative_packet_literary_tokens: 6400
  structured_metadata_token_allowance_per_packet: 3500
  json_serialization_token_allowance_per_packet: 1000
  max_creative_packet_output_tokens: 10900
  context_safety_reserve_tokens: 4096
  minimum_model_context_window_tokens: 64148
  minimum_model_output_tokens: 10900
  max_analysis_output_tokens: 4096
  max_creative_step_count: derived_per_run
  max_analysis_or_index_step_count: derived_per_run
  max_cumulative_input_tokens: derived_per_run
  max_cumulative_output_tokens: derived_per_run
  max_memory_records: derived_per_run
  formulae:
    creative_packet_output: >
      ceil(max_creative_packet_literary_words / words_per_token_assumption) +
      structured_metadata_token_allowance_per_packet +
      json_serialization_token_allowance_per_packet
    context_window: >
      max_prepared_context_tokens + max_creative_packet_output_tokens +
      context_safety_reserve_tokens <= selected_model_context_window_tokens
    creative_steps: >
      2 + ceil(possible_scene_count / 3) + ceil(ending_hard_max / 2)
    memory_records: "max(1000, possible_scene_count * 45)"
  preflight_rules:
    - "Record documented context-window and maximum-output limits for each selected model."
    - "Fail before generation if any planned step exceeds its model's context or output limit."
    - "Fail before generation if the derived scope cannot fit cumulative token, memory, or configured cost limits."
    - "Packet size may be reduced within the frozen architecture; committed content may not be regenerated."

generation_run:
  definition: >
    One autonomous generation run begins from frozen engine inputs and a frozen
    generation brief, then progresses causally forward until completion or failure
    without human creative steering or mutation of committed creative artifacts.
  human_creative_interventions_required: 0
  committed_creative_rewrites_allowed: false
  committed_creative_regeneration_allowed: false
  backward_canon_mutation_allowed: false
  candidate_cherry_picking_allowed: false
  append_only: true
  causally_forward: true
  creative_step_count_may_exceed_one: true
  protocol_contract: engine/data/generation-protocol.schema.json
  ledger_format: jsonl
  traversal_strategy: dependency_topological
  traversal_frozen_before_literary_packets: true
  phases:
    - genesis
    - macroarchitecture
    - forward_literary_packets
    - endings_and_residue
    - validation_and_static_build
  freeze_levels:
    engine_canon: before_run
    generation_brief: before_run
    generated_root_canon: genesis_commit
    generated_architecture: architecture_commit
    creative_artifacts: containing_packet_commit
  forbidden_patterns:
    - human_creative_steering_after_start
    - creative_candidate_sampling_and_selection
    - critique_then_rewrite
    - regenerate_committed_artifact
    - silently_retcon_committed_fact
    - discard_valid_output_for_artistic_weakness
    - generate_during_play

run_processing:
  creative_steps_may:
    - author_genesis
    - author_frozen_macroarchitecture
    - author_forward_literary_packets
    - author_prerequisite_satisfied_ending_packets
  analysis_or_index_steps_may:
    - extract_source_grounded_facts
    - update_retrieval_indexes
    - classify_motifs
    - check_continuity
    - retrieve_relevant_immutable_passages
  deterministic_steps_may:
    - validate_protocol_records_ids_references_graph_and_state
    - append_ledger_and_memory_events
    - project_committed_records_into_repo_files
    - create_frontmatter
    - serialize_json_and_mdx_without_literary_change
    - hash_generated_files
    - compile_static_astro_site
  literary_change_forbidden: true

validation:
  mechanical_result: pass_or_fail
  artistic_result: pass_or_fail_generation
  repair_policy:
    serialization_only_when_literary_bytes_unchanged: true
    creative_repair_allowed: false
    failed_generation_may_be_replaced_by_fresh_generation: true
  acceptance_source: engine/canon/acceptance-tests.md

complete_work_barrier:
  partial_play_allowed: false
  interleaved_generation_and_play_allowed: false
  runtime_branch_completion_allowed: false
  playable_only_when_status: READY_TO_PLAY
  terminal_statuses:
    - READY_TO_PLAY
    - FAILED_GENERATION

generated_output_integrity:
  prose_is:
    - readable
    - inspectable
    - renderable
    - diffable
    - immutable
  accepted_literary_file_hashes_required: true
  human_literary_editing_allowed: false

provenance:
  required_fields:
    - generation_id
    - run_status
    - work_seed
    - engine_commit_sha
    - engine_config_hashes
    - frozen_generation_brief_hash
    - step_specific_provider_model_and_parameters
    - prompt_and_context_hashes
    - step_output_hashes
    - seeds
    - threshold_geomancy_seed_and_config_hash
    - structural_generation_seed_and_config_hash
    - timestamps
    - token_and_cost_accounting_when_available
    - creative_step_count
    - analysis_or_index_step_count
    - human_intervention_count
    - committed_rewrite_count
    - committed_regeneration_count
    - backtrack_count
    - ledger_head_hash
  compliance_rules:
    - "human_intervention_count must equal 0"
    - "committed_rewrite_count must equal 0"
    - "committed_regeneration_count must equal 0"
    - "backtrack_count must equal 0"
    - "creative_step_count may be greater than one"

build_target:
  framework: astro
  static_only: true
  client_side_state_only: true
  live_ai_at_runtime: false
  generated_work_location: generation_branch_or_release
  main_branch_contains_generated_work: false
  quality_contract: engine/docs/build-contract.md
