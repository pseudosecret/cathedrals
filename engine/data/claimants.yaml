version: 1.0

purpose: >
  Define generative law for a variable claimant set without defining any claimant.
  Five to eight initial full fictional profiles are authored together in the Genesis
  cast step after their minimal identity anchors. The set may resolve or expand while
  Genesis constraints remain uncommitted, then freezes as root canon.

claimant_set:
  initial_count_min: 5
  initial_count_max: 8
  total_count_max: 12
  technical_slots:
    - claimant_slot_01
    - claimant_slot_02
    - claimant_slot_03
    - claimant_slot_04
    - claimant_slot_05
    - claimant_slot_06
    - claimant_slot_07
    - claimant_slot_08
    - claimant_slot_09
    - claimant_slot_10
    - claimant_slot_11
    - claimant_slot_12
  slot_semantics: none
  generation_mode: simultaneous_set_generation
  locked_fictional_identity_allowed: false
  prewritten_archetype_selection_allowed: false
  deterministic_claimant_generation_allowed: false
  extension_phase: genesis_constraints_before_commit
  extension_policy:
    - resolve_to_an_existing_claimant_or_character_when_plausible
    - supporting_characters_may_source_facts_without_promotion
    - expand_only_for_a_genuinely_distinct_world_logic
    - prefer_promoting_an_existing_character_over_creating_a_new_identity
    - require_an_incident_role_and_relationship_to_an_existing_claimant

required_generated_dimensions:
  identity:
    - stable_generated_id
    - name
    - exact_relationship_to_setting_and_incident
    - exact_role_or_occupation_if_any
    - personality
  interpretive_pressure:
    - epistemic_regime
    - relationship_to_responsibility
    - evidence_logic
    - way_of_establishing_truth
    - contradiction_mode
  expression:
    - emotional_pressure
    - rhetorical_behavior
    - cadence
    - diction
    - linguistic_effect_on_nearby_prose
    - literary_or_genre_effect
  material_consequence:
    - artifact_affinity
    - environmental_pressure
    - accusation_consequence
    - hesitation_and_retraction_pressure

set_level_hard_constraints:
  - "Every claimant must interact materially and dramatically with the generated setting."
  - "Every claimant must exert a distinct interpretive pressure on the same generated incident."
  - "No two may have closely overlapping epistemic regimes."
  - "No two may rely primarily on the same evidence logic."
  - "No two may be interchangeable in rhetoric, cadence, emotional pressure, or dramatic function."
  - "No two may produce substantially the same artifact behavior or environmental consequence."
  - "The set must produce distinct kinds of consequence without becoming symmetrical routes."
  - "At least one claimant must pressure truth through material or institutional evidence."
  - "At least one claimant must pressure truth through relational or experiential evidence."
  - "At least one claimant must establish a way of knowing the others initially struggle to assimilate."
  - "Claimants may overlap secondarily, but primary evidence and truth logic must remain distinct."
  - "Every claimant must remain compatible with the generated setting and engine ontology."

set_level_soft_constraints:
  - "Prefer surprising but legible combinations over familiar mystery archetypes."
  - "Avoid redundant genre feel."
  - "Avoid variations of any one authority, emotional, supernatural, or explanatory pattern."
  - "Let claimant influence emerge unevenly across branches, artifacts, reconvergence, and endings."

prose_differentiation_law:
  required_axes:
    - diction
    - cadence
    - syntax
    - paragraph_behavior
    - rhetorical_strategy
  focus_ladder:
    ambient: mostly_neutral
    passing_focus: very_light_to_light
    primary_focus: moderate
    dominant_focus: moderate_to_heavy
  rules:
    - "Focus, not route label alone, controls linguistic pressure."
    - "Differentiation must change sentence and paragraph behavior, not merely adjectives."
    - "Artifact bodies must remain plausible objects even when framing pressure intensifies."
    - "Heavy pressure must remain readable and materially grounded."

validation:
  pairwise_checks:
    - epistemic_regime_distance
    - evidence_logic_distance
    - rhetorical_behavior_distance
    - emotional_pressure_distance
    - artifact_affinity_distance
    - environmental_consequence_distance
    - dramatic_function_distance
  reject_if:
    - pair_differs_only_in_metadata
    - pair_differs_only_in_adjectives_or_mood
    - claimant_is_a_renamed_prewritten_archetype
    - claimant_exists_only_to_fill_a_predetermined_difference
    - evidence_or_voice_could_be_swapped_without_substantial_effect
    - set_cannot_create_distinct_consequences
  result: pass_or_fail_generation

forbidden_before_generation:
  - claimant_names
  - claimant_occupations
  - claimant_personalities
  - exact_incident_roles
  - exact_speech_patterns
  - exact_evidence_families
  - exact_emotional_registers
  - exact_contradiction_motifs
  - exact_environmental_mutations
  - exact_literary_genres
  - exact_accusation_consequences
